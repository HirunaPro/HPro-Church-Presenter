name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Read Python version
        id: py
        shell: bash
        run: |
          v=$(sed -n 's/^python-\(.*\)$/\1/p' runtime.txt 2>/dev/null | head -n1)
          echo "version=${v:-3.13}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.py.outputs.version }}

      - name: Test
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pip install -r requirements-dev.txt
            python -m pytest tests
          fi

      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./deployment/native/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deployment/native/build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: church-presenter-${{ matrix.name }}
          path: |
            dist/church-presenter-*.tar.gz
            dist/church-presenter-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Add version to asset names
        run: |
          cd artifacts
          for f in church-presenter-*; do mv "$f" "${f/church-presenter-/church-presenter-${GITHUB_REF_NAME}-}"; done
          ls -l
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
