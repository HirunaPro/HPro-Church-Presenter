<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
:root {
    --bg: #05070a;
    --bg-2: #0d1117;
    --text: #f5f3ee;
    --muted: rgba(245, 243, 238, .55);
    --accent: #d8bf8a;
    --accent-dim: rgba(216, 191, 138, .35);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
    width: 100%; height: 100%; overflow: hidden; cursor: none;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-2) 0%, var(--bg) 75%);
    color: var(--text);
    font-family: 'Noto Sans Sinhala', 'Noto Sans Tamil', 'Iskoola Pota', 'Latha', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
}
.glow {
    position: fixed; width: 90vmax; height: 90vmax; border-radius: 50%;
    pointer-events: none; will-change: transform;
}
.glow.a {
    left: -35vmax; top: -50vmax;
    background: radial-gradient(circle, rgba(216,191,138,.075), transparent 62%);
    animation: drift-a 48s ease-in-out infinite alternate;
}
.glow.b {
    right: -40vmax; bottom: -55vmax;
    background: radial-gradient(circle, rgba(90,120,170,.09), transparent 62%);
    animation: drift-b 60s ease-in-out infinite alternate;
}
@keyframes drift-a { to { transform: translate3d(14vw, 10vh, 0); } }
@keyframes drift-b { to { transform: translate3d(-12vw, -8vh, 0); } }

.stage {
    position: fixed; inset: 0;
    padding: 7vh 6vw;
    display: flex; align-items: center; justify-content: center;
}
.content {
    width: 100%; max-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 3.2vh;
    animation: rise 1.4s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise { from { opacity: 0; transform: translate3d(0, 1.5vh, 0); } }

.logo { max-height: 14vh; max-width: 30vw; object-fit: contain; }
.eyebrow {
    display: flex; align-items: center; gap: 1.6vw;
    font-size: clamp(16px, 2.3vh, 64px); letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); font-weight: 500;
}
.eyebrow .dot { width: .35em; height: .35em; border-radius: 50%; background: var(--accent-dim); flex: none; }
.eyebrow span { text-wrap: balance; }

.title {
    font-size: clamp(36px, 11vh, 400px); line-height: 1.22; font-weight: 700;
    letter-spacing: -.005em; max-width: 100%;
    text-wrap: balance; overflow-wrap: anywhere;
}
.rule {
    width: 9vw; height: max(2px, .3vh); border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.quote { max-width: 78vw; display: flex; flex-direction: column; align-items: center; gap: 2.4vh; }
.message {
    font-size: clamp(20px, 4.2vh, 150px); line-height: 1.6; font-weight: 400;
    color: rgba(245,243,238,.88); text-wrap: balance; overflow-wrap: anywhere;
}
.reference { font-size: clamp(16px, 2.8vh, 96px); color: var(--muted); font-weight: 500; }
.reference::before { content: "\2014\00a0"; color: var(--accent-dim); }

.only-title .title { font-size: clamp(44px, 15vh, 520px); }

@media (prefers-reduced-motion: reduce) {
    .glow, .content { animation: none; }
}
</style>
</head>
<body>
<div class="glow a"></div>
<div class="glow b"></div>
<main class="stage">
    <div class="content" id="content">
        <img class="logo" id="logo" alt="" hidden>
        <div class="eyebrow" id="eyebrow" hidden>
            <span id="subtitle" hidden></span>
            <i class="dot" id="dot" hidden></i>
            <span id="year" hidden></span>
        </div>
        <h1 class="title" id="title">Welcome</h1>
        <div class="rule" id="rule" hidden></div>
        <blockquote class="quote" id="quote" hidden>
            <p class="message" id="message" hidden></p>
            <cite class="reference" id="reference" hidden></cite>
        </blockquote>
    </div>
</main>
<script>
(function () {
    var $ = function (id) { return document.getElementById(id); };
    var content = $('content'), stage = document.querySelector('.stage'), titleEl = $('title');

    function set(id, text) {
        var el = $(id), v = (text == null ? '' : String(text)).trim();
        el.textContent = v;
        el.hidden = !v;
        return !!v;
    }

    // Shrink the largest text blocks until the whole composition fits the safe area.
    function fit() {
        var els = [titleEl, $('message')];
        els.forEach(function (e) { e.style.fontSize = ''; });
        var avail = stage.clientHeight - parseFloat(getComputedStyle(stage).paddingTop) * 2;
        var sizes = els.map(function (e) { return parseFloat(getComputedStyle(e).fontSize); });
        for (var i = 0; i < 40 && content.scrollHeight > avail; i++) {
            els.forEach(function (e, k) {
                if (e.hidden) return;
                sizes[k] *= 0.94;
                e.style.fontSize = sizes[k] + 'px';
            });
        }
    }

    function render(d) {
        d = d || {};
        var hasTitle = set('title', d.title || (d.title === undefined ? 'Welcome' : ''));
        var hasSub = set('subtitle', d.subtitle), hasYear = set('year', d.year);
        $('dot').hidden = !(hasSub && hasYear);
        $('eyebrow').hidden = !(hasSub || hasYear);
        var hasMsg = set('message', d.message), hasRef = set('reference', d.reference);
        $('quote').hidden = !(hasMsg || hasRef);
        $('rule').hidden = !(hasTitle && !$('quote').hidden);
        content.classList.toggle('only-title', hasTitle && $('eyebrow').hidden && $('quote').hidden);

        var logo = $('logo');
        logo.hidden = true;
        if (d.logo) {
            logo.onload = function () { logo.hidden = false; fit(); };
            logo.onerror = function () { logo.hidden = true; };
            logo.src = d.logo;
        }
        fit();
    }

    fetch('welcome.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .catch(function () { return {}; })
        .then(render);

    window.addEventListener('resize', fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
